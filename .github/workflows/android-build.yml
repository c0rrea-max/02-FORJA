name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'scripts/generate-brand-assets.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Create branded source images
        run: node scripts/generate-brand-assets.cjs
      - name: Regenerate Android scaffold
        run: |
          mv android android-source
          npx cap add android
      - name: Generate Android icons and splash screens
        run: npx capacitor-assets generate --android
      - name: Declare camera permission
        run: sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Build debug APK
        run: gradle --project-dir android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
